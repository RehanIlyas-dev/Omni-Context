name: Keep Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl -sf https://omni-context-jys7.onrender.com/ || exit 1
          echo "Backend pinged successfully at $(date -u)"
